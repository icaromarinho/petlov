
name: Cypress e2e Tests

on: push

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.16.0
      options: --user 1001
    
    browser: chrome

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - container: 1
            spec: |
              cypress/e2e/cadastro.cy.js
              
          - container: 2
            spec: |
              cypress/e2e/landing.cy.js
              
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          spec: ${{ matrix.spec }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.container }}
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos-${{ matrix.container }}
          path: cypress/videos
          if-no-files-found: ignore
